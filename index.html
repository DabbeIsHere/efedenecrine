<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e8d5ff" />
<title>Efe'den Ecrin'e</title>
<link rel="canonical" href="https://efedenencrine.com" />
<meta property="og:url" content="https://efedenencrine.com" />
<meta property="og:title" content="Efe'den Ecrin'e" />
<meta property="og:description" content="Hâlâ küs müyüz?" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Quicksand', system-ui, -apple-system, sans-serif;
    color: #4b3a6e;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    background: linear-gradient(
      135deg,
      #e9d6ff 0%,
      #ffd7ec 22%,
      #d3e6ff 48%,
      #e6d9ff 72%,
      #ffe1f1 100%
    );
    background-size: 320% 320%;
    animation: bgShift 26s ease-in-out infinite;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    pointer-events: none;
    z-index: 0;
    opacity: .55;
  }
  .glow-a {
    width: 48vw; height: 48vw; min-width: 260px; min-height: 260px;
    top: -14vh; left: -14vw;
    background: #b8a1ff;
    animation: drift1 17s ease-in-out infinite;
  }
  .glow-b {
    width: 44vw; height: 44vw; min-width: 240px; min-height: 240px;
    bottom: -16vh; right: -12vw;
    background: #ffb3da;
    animation: drift2 21s ease-in-out infinite;
  }
  .glow-c {
    width: 36vw; height: 36vw; min-width: 200px; min-height: 200px;
    bottom: 6vh; left: -10vw;
    background: #a8d2ff;
    animation: drift1 24s ease-in-out infinite reverse;
  }
  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(6vw, 5vh) scale(1.14); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1.06); }
    50%      { transform: translate(-7vw, -6vh) scale(.9); }
  }

  .brand {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 80;
    padding: 9px 22px;
    border-radius: 999px;
    font-family: 'Fredoka', sans-serif;
    font-size: .95rem;
    font-weight: 600;
    letter-spacing: .06em;
    white-space: nowrap;
    color: #ffffff;
    background: rgba(139, 116, 200, .42);
    border: 1px solid rgba(255, 255, 255, .7);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow:
      0 8px 26px rgba(122, 92, 170, .22),
      inset 0 1px 0 rgba(255, 255, 255, .6);
    text-shadow: 0 1px 10px rgba(90, 60, 140, .5);
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 44px;
    padding: 100px 24px 56px;
    text-align: center;
    opacity: 1;
    transform: scale(1);
    transition: opacity .5s ease, transform .5s ease;
    z-index: 10;
  }
  .stage.gone {
    opacity: 0;
    transform: scale(.92);
    pointer-events: none;
  }

  .ask {
    margin: 0;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(2rem, 9vw, 3.8rem);
    line-height: 1.12;
    letter-spacing: -.01em;
    color: #4b3a6e;
    text-shadow: 0 4px 22px rgba(255, 255, 255, .9);
    max-width: 13em;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.18rem;
    font-weight: 600;
    letter-spacing: .01em;
    padding: 16px 46px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition:
      transform .4s cubic-bezier(.34, 1.56, .64, 1),
      box-shadow .3s ease,
      left .4s cubic-bezier(.34, 1.56, .64, 1),
      top .4s cubic-bezier(.34, 1.56, .64, 1);
  }

  .btn-evet {
    position: relative;
    z-index: 5;
    color: #ffffff;
    background: linear-gradient(135deg, #8d78ee 0%, #b26ce0 55%, #e878bf 100%);
    box-shadow: 0 14px 32px rgba(140, 110, 220, .4);
    transform-origin: center center;
    will-change: transform;
  }
  .btn-evet:active { filter: brightness(.96); }

  .btn-hayir {
    position: relative;
    z-index: 60;
    color: #6b5a90;
    background: rgba(255, 255, 255, .95);
    box-shadow: 0 12px 26px rgba(150, 130, 190, .28);
    will-change: left, top, transform;
  }

  #final {
    gap: 26px;
    padding-top: 108px;
  }

  .yep {
    margin: 0;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(3.2rem, 18vw, 8.5rem);
    line-height: 1;
    letter-spacing: -.02em;
    background: linear-gradient(100deg, #8d78ee 0%, #e86bb0 48%, #5fa8ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 8px 22px rgba(180, 120, 220, .38));
    animation:
      popIn .95s cubic-bezier(.2, 1.7, .45, 1) both,
      floaty 3.4s ease-in-out 1.1s infinite;
  }

  @keyframes popIn {
    0%   { transform: scale(.25) rotate(-9deg); opacity: 0; }
    62%  { transform: scale(1.14) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg);   opacity: 1; }
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-9px); }
  }

  .cat-frame {
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(200px, 60vw, 340px);
    height: clamp(200px, 60vw, 340px);
    border-radius: 34px;
    padding: 10px;
    background: rgba(255, 255, 255, .58);
    border: 1px solid rgba(255, 255, 255, .9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow:
      0 24px 54px rgba(140, 110, 200, .3),
      inset 0 1px 0 rgba(255, 255, 255, .95);
    overflow: hidden;
    animation: catBounce 2.8s ease-in-out infinite;
  }

  @keyframes catBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-11px) scale(1.025); }
  }

  #catGif {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 26px;
    display: block;
  }
  #catFallback {
    display: none;
    width: 100%;
    height: 100%;
  }
  #catFallback svg { width: 100%; height: 100%; display: block; }

  .devam {
    margin: 0;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(1.35rem, 6.2vw, 2.1rem);
    color: #5a4585;
    text-shadow: 0 2px 16px rgba(255, 255, 255, .95);
    animation: popIn .95s cubic-bezier(.2, 1.7, .45, 1) .4s both;
  }

  .link-pill {
    display: inline-block;
    margin-top: 4px;
    padding: 10px 24px;
    border-radius: 999px;
    font-family: 'Fredoka', sans-serif;
    font-size: .95rem;
    font-weight: 500;
    letter-spacing: .06em;
    color: #6b5a90;
    text-decoration: none;
    background: rgba(255, 255, 255, .72);
    border: 1px solid rgba(255, 255, 255, .95);
    box-shadow: 0 10px 24px rgba(150, 130, 190, .22);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), box-shadow .3s ease;
    animation: popIn .95s cubic-bezier(.2, 1.7, .45, 1) .6s both;
  }
  .link-pill:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 16px 30px rgba(150, 130, 190, .3);
  }
  .link-pill:active { transform: scale(.97); }

  .heart {
    position: fixed;
    bottom: -80px;
    width: var(--s);
    height: var(--s);
    background: var(--c);
    transform: rotate(-45deg);
    pointer-events: none;
    z-index: 4;
    animation-name: floatUp;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform, opacity;
  }
  .heart::before,
  .heart::after {
    content: '';
    position: absolute;
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: var(--c);
  }
  .heart::before { top: calc(var(--s) / -2); left: 0; }
  .heart::after  { top: 0; left: calc(var(--s) / 2); }

  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(-45deg) scale(.5); opacity: 0; }
    14%  { opacity: .85; }
    84%  { opacity: .85; }
    100% { transform: translateY(-118vh) rotate(-45deg) scale(1.15); opacity: 0; }
  }

  @media (max-width: 420px) {
    .btn { padding: 15px 36px; font-size: 1.1rem; }
    .stage { gap: 36px; }
    .brand { font-size: .85rem; padding: 8px 18px; }
  }
</style>
</head>
<body>

  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="glow glow-c"></div>

  <header class="brand">Efe'den Ecrin'e</header>

  <section class="stage" id="stage1">
    <h1 class="ask">hâlâ küs müyüz?</h1>
    <div class="row">
      <button class="btn btn-evet" id="evet1" type="button">Evet</button>
      <button class="btn btn-hayir" id="hayir1" type="button">Hayır</button>
    </div>
  </section>

  <section class="stage gone" id="stage2">
    <h1 class="ask">O zaman resmen barıştık mı?</h1>
    <div class="row">
      <button class="btn btn-evet" id="evet2" type="button">Evet</button>
      <button class="btn btn-hayir" id="hayir2" type="button">Hayır</button>
    </div>
  </section>

  <section class="stage gone" id="final">
    <h1 class="yep">YEPPİİİ!</h1>

    <div class="cat-frame">
      <img id="catGif" alt="Kalp yapan tatlı bir kedi" />
      <div id="catFallback" aria-hidden="true">
        <svg viewBox="0 0 220 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kalp yapan kedi">
          <path d="M110 86 C103 66 76 62 68 79 C60 96 81 113 110 136 C139 113 160 96 152 79 C144 62 117 66 110 86 Z" fill="#ff8ec4"/>
          <path d="M62 158 L50 108 L94 132 Z" fill="#c3a4f0"/>
          <path d="M158 158 L170 108 L126 132 Z" fill="#c3a4f0"/>
          <ellipse cx="110" cy="186" rx="64" ry="54" fill="#e6d7fd"/>
          <ellipse cx="87" cy="178" rx="6.5" ry="8.5" fill="#4a3a6b"/>
          <ellipse cx="133" cy="178" rx="6.5" ry="8.5" fill="#4a3a6b"/>
          <ellipse cx="73" cy="197" rx="11" ry="6.5" fill="#ffb3d6" opacity=".85"/>
          <ellipse cx="147" cy="197" rx="11" ry="6.5" fill="#ffb3d6" opacity=".85"/>
          <path d="M110 193 l-7 -6 h14 z" fill="#f2789f"/>
          <path d="M110 193 q-9 13 -18 2" stroke="#4a3a6b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M110 193 q9 13 18 2" stroke="#4a3a6b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M46 178 L16 171 M46 189 L16 192" stroke="#b9a6d8" stroke-width="3" stroke-linecap="round"/>
          <path d="M174 178 L204 171 M174 189 L204 192" stroke="#b9a6d8" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <p class="devam">Kaldığımız yerden devam!</p>
    <a class="link-pill" href="https://efedenencrine.com">efedenencrine.com</a>
  </section>

<script>
(function () {
  'use strict';

  var rnd = function (min, max) { return Math.random() * (max - min) + min; };
  var canHover = window.matchMedia && window.matchMedia('(hover: hover)').matches;

  var stages = {
    1: document.getElementById('stage1'),
    2: document.getElementById('stage2'),
    3: document.getElementById('final')
  };

  function goTo(n) {
    Object.keys(stages).forEach(function (k) {
      var s = stages[k];
      if (Number(k) === n) s.classList.remove('gone');
      else s.classList.add('gone');
    });
  }

  function wireStage(opts) {
    var evet = opts.evet;
    var hayir = opts.hayir;
    var step = opts.step;
    var maxScale = opts.maxScale;
    var onDone = opts.onDone;

    var taps = 0;
    var finished = false;
    var pinned = false;
    var lastEscape = 0;

    function pinHayir() {
      if (pinned) return;
      pinned = true;
      var r = hayir.getBoundingClientRect();
      hayir.style.position = 'fixed';
      hayir.style.left = r.left + 'px';
      hayir.style.top = r.top + 'px';
      hayir.style.width = r.width + 'px';
      hayir.style.margin = '0';
      void hayir.offsetWidth;
    }

    function escape() {
      var now = Date.now();
      if (now - lastEscape < 140) return;
      lastEscape = now;

      pinHayir();

      var pad = 12;
      var w = hayir.offsetWidth || 120;
      var h = hayir.offsetHeight || 54;
      var vw = window.innerWidth;
      var vh = window.innerHeight;

      var maxX = Math.max(pad, vw - w - pad);
      var maxY = Math.max(pad, vh - h - pad);

      var x = rnd(pad, maxX);
      var y = rnd(pad, maxY);

      hayir.style.left = x + 'px';
      hayir.style.top = y + 'px';
      hayir.style.transform = 'rotate(' + rnd(-18, 18).toFixed(1) + 'deg)';

      taps++;
      var scale = Math.min(1 + taps * step, maxScale);
      evet.style.transform = 'scale(' + scale + ')';
    }

    hayir.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      escape();
    });
    hayir.addEventListener('click', function (e) { e.preventDefault(); });

    if (canHover) {
      hayir.addEventListener('mouseenter', escape);
    }

    evet.addEventListener('click', function (e) {
      e.preventDefault();
      if (finished) return;
      finished = true;
      onDone();
    });
  }

  wireStage({
    evet: document.getElementById('evet1'),
    hayir: document.getElementById('hayir1'),
    step: 0.55,
    maxScale: 5,
    onDone: function () { goTo(2); }
  });

  wireStage({
    evet: document.getElementById('evet2'),
    hayir: document.getElementById('hayir2'),
    step: 1.8,
    maxScale: 32,
    onDone: function () {
      goTo(3);
      spawnHearts();
    }
  });

  var heartsStarted = false;
  function spawnHearts() {
    if (heartsStarted) return;
    heartsStarted = true;

    var colors = ['#ff9ecb', '#c9a7f5', '#9fd0ff', '#ffc4e1', '#b8a6ff', '#ffb0d4'];

    for (var i = 0; i < 26; i++) {
      var h = document.createElement('div');
      h.className = 'heart';
      var size = rnd(10, 24).toFixed(1) + 'px';
      h.style.setProperty('--s', size);
      h.style.setProperty('--c', colors[Math.floor(Math.random() * colors.length)]);
      h.style.left = rnd(-2, 98).toFixed(1) + 'vw';
      h.style.animationDuration = rnd(7, 14).toFixed(1) + 's';
      h.style.animationDelay = rnd(0, 7).toFixed(1) + 's';
      document.body.appendChild(h);
    }
  }

  var catGif = document.getElementById('catGif');
  var catFallback = document.getElementById('catFallback');

  var catSources = [
    'https://media.giphy.com/media/GeimqsH0TLDt4tScGw/giphy.gif',
    'https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif',
    'https://media.giphy.com/media/VbnUQpnihPSIgIXuZv/giphy.gif',
    'https://media.giphy.com/media/u9BxQbM5bxvsc/giphy.gif'
  ];
  var catIndex = 0;

  function loadCat() {
    if (catIndex >= catSources.length) {
      catGif.style.display = 'none';
      catFallback.style.display = 'block';
      return;
    }
    catGif.src = catSources[catIndex];
  }

  catGif.addEventListener('error', function () {
    catIndex++;
    loadCat();
  });

  loadCat();

  window.addEventListener('resize', function () {
    ['hayir1', 'hayir2'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el || el.style.position !== 'fixed') return;
      var w = el.offsetWidth, h = el.offsetHeight;
      var maxX = Math.max(12, window.innerWidth - w - 12);
      var maxY = Math.max(12, window.innerHeight - h - 12);
      var x = Math.min(parseFloat(el.style.left) || 12, maxX);
      var y = Math.min(parseFloat(el.style.top) || 12, maxY);
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    });
  });

})();
</script>
</body>
</html>
